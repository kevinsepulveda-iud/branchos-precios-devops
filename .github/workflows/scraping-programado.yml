# Automatización de la extracción: todos los lunes a las 6:00 a. m. (hora Colombia)
# GitHub Actions corre el scraper, valida el dataset y, si está completo,
# lo guarda en data/historico con un commit. Ese commit dispara el CD.
name: Scraping programado

on:
  schedule:
    - cron: "0 11 * * 1"      # 11:00 UTC = 6:00 a. m. en Colombia
  workflow_dispatch:
    inputs:
      paginas:
        description: "Tope de páginas (vacío = catálogo completo)"
        required: false

permissions:
  contents: write

jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scraping y control de calidad
        run: |
          if [ -n "${{ github.event.inputs.paginas }}" ]; then
            python scripts/extraer.py --paginas ${{ github.event.inputs.paginas }}
          else
            python scripts/extraer.py
          fi

      - name: Guardar el dataset en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "data: extracción automática $(date +%F)"
          git push

      - name: Guardar el log de la ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultima-ejecucion
          path: data/ultima_ejecucion.json
