# Integración continua: cada push o pull request ejecuta el linter y las pruebas.
# Si algo falla, GitHub marca el PR en rojo y no se debe hacer merge a main.
name: CI - pruebas y calidad

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  pruebas:
    name: Pruebas (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]   # mismas versiones que usan Colab y mi PC

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Revisar estilo con ruff
        run: ruff check .

      - name: Ejecutar pruebas con cobertura
        run: pytest --cov=src/branchos --cov-report=term-missing --cov-report=xml --junitxml=reporte-pruebas.xml

      - name: Guardar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas-py${{ matrix.python-version }}
          path: |
            reporte-pruebas.xml
            coverage.xml
